<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Framewright — live composition guide</title>
<style>
  :root {
    --ink: #0a0c0a;
    --panel: #14170f;
    --line: rgba(230, 235, 210, 0.14);
    --paper: #e9ecdf;
    --dim: #8a9080;
    --signal: #c7ff5e;
    --signal-dim: #7a9142;
    --warn: #ff9d5e;
    --mono: "SFMono-Regular", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: var(--ink);
    font-family: var(--sans); color: var(--paper); overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  #stage {
    position: relative; width: 100%; height: 100dvh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(var(--mirror, 1));
  }
  canvas#overlay {
    position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
  }

  /* Top HUD */
  #topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: max(14px, env(safe-area-inset-top)) 16px 0 16px;
  }
  .pill {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.02em;
    background: rgba(10,12,10,0.55); backdrop-filter: blur(6px);
    border: 1px solid var(--line); border-radius: 100px;
    padding: 6px 12px; color: var(--dim);
  }
  #score-pill { color: var(--paper); display: flex; align-items: center; gap: 8px; }
  #score-num { color: var(--signal); font-weight: 600; font-size: 13px; }

  /* Guidance strip */
  #guidance {
    position: absolute; top: 64px; left: 50%; transform: translateX(-50%);
    z-index: 5; text-align: center; pointer-events: none;
    font-family: var(--mono); font-size: 13px; color: var(--paper);
    background: rgba(10,12,10,0.5); backdrop-filter: blur(6px);
    padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line);
    max-width: 86%; transition: opacity 0.2s ease;
  }
  #guidance .arrow { color: var(--signal); margin-right: 6px; }

  /* Bottom controls */
  #bottombar {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 5;
    padding: 0 20px max(22px, env(safe-area-inset-bottom)) 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .side-btn {
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(10,12,10,0.5); border: 1px solid var(--line);
    color: var(--paper); display: flex; align-items: center; justify-content: center;
    font-size: 18px; backdrop-filter: blur(6px);
  }
  #shutter {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--paper); border: 4px solid rgba(255,255,255,0.25);
    position: relative;
  }
  #shutter:active { transform: scale(0.94); }
  #shutter.ready::after {
    content: ""; position: absolute; inset: -8px; border-radius: 50%;
    border: 2px solid var(--signal);
  }

  /* Boot / permission screen */
  #boot {
    position: absolute; inset: 0; z-index: 10; background: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px; gap: 18px;
  }
  #boot h1 {
    font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em;
  }
  #boot p { color: var(--dim); font-size: 14px; line-height: 1.5; max-width: 320px; margin: 0; }
  #boot button {
    margin-top: 8px; background: var(--signal); color: #10140a; border: none;
    font-weight: 600; font-size: 15px; padding: 13px 28px; border-radius: 100px;
  }
  #boot .status { font-family: var(--mono); font-size: 12px; color: var(--signal-dim); }
  #boot.hidden { display: none; }

  /* Snapshot review */
  #review {
    position: absolute; inset: 0; z-index: 12; background: var(--ink);
    display: none; flex-direction: column; align-items: center; justify-content: center;
  }
  #review.show { display: flex; }
  #review img { max-width: 92%; max-height: 74%; border-radius: 8px; }
  #review .actions { display: flex; gap: 14px; margin-top: 18px; }
  #review button {
    font-family: var(--sans); font-size: 14px; padding: 11px 22px; border-radius: 100px;
    border: 1px solid var(--line); background: rgba(255,255,255,0.06); color: var(--paper);
  }
  #review .save { background: var(--signal); color: #10140a; border: none; font-weight: 600; }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>

  <div id="topbar">
    <div class="pill" id="model-pill">loading model…</div>
    <div class="pill" id="score-pill">SCORE <span id="score-num">–</span></div>
  </div>

  <div id="guidance">Point the camera at your subject</div>

  <div id="bottombar">
    <button class="side-btn" id="flip-btn" title="Flip camera">⟲</button>
    <button id="shutter"></button>
    <button class="side-btn" id="grid-btn" title="Toggle grid">▦</button>
  </div>
</div>

<div id="boot">
  <h1>Framewright</h1>
  <p>A camera that watches the frame with you — on-device AI finds your subject and nudges you toward a better composition. No accounts, no limits, nothing leaves your phone.</p>
  <button id="start-btn">Open camera</button>
  <div class="status" id="boot-status"></div>
</div>

<div id="review">
  <img id="review-img" alt="Captured photo" />
  <div class="actions">
    <button id="retake">Retake</button>
    <button class="save" id="save">Save photo</button>
  </div>
</div>

<script type="module">
import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const ctx = overlay.getContext("2d");
const guidanceEl = document.getElementById("guidance");
const scoreNum = document.getElementById("score-num");
const modelPill = document.getElementById("model-pill");
const shutter = document.getElementById("shutter");
const flipBtn = document.getElementById("flip-btn");
const gridBtn = document.getElementById("grid-btn");
const boot = document.getElementById("boot");
const startBtn = document.getElementById("start-btn");
const bootStatus = document.getElementById("boot-status");
const review = document.getElementById("review");
const reviewImg = document.getElementById("review-img");

let detector = null;
let facing = "environment";
let showGrid = true;
let stream = null;
let running = false;
let lastDet = null;

async function loadModel() {
  bootStatus.textContent = "fetching detection model…";
  try {
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );

    const modelAssetPath =
      "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite";

    try {
      // Prefer GPU when available.
      detector = await ObjectDetector.createFromOptions(vision, {
        baseOptions: { modelAssetPath, delegate: "GPU" },
        scoreThreshold: 0.35,
        maxResults: 5,
        runningMode: "VIDEO",
      });
    } catch (gpuErr) {
      // Fall back to CPU on browsers/devices where GPU inference fails.
      console.warn("GPU delegate failed; falling back to CPU.", gpuErr);
      detector = await ObjectDetector.createFromOptions(vision, {
        baseOptions: { modelAssetPath, delegate: "CPU" },
        scoreThreshold: 0.35,
        maxResults: 5,
        runningMode: "VIDEO",
      });
    }

    modelPill.textContent = "model ready";
    setTimeout(() => (modelPill.style.opacity = "0.5"), 1500);
    return true;
  } catch (err) {
    console.error("Model initialization failed:", err);
    modelPill.textContent = "model error";
    bootStatus.textContent = "couldn't load the AI model — check your internet connection and reload.";
    return false;
  }
}

async function startCamera() {
  bootStatus.textContent = "requesting camera access…";
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();
    document.documentElement.style.setProperty("--mirror", facing === "user" ? "-1" : "1");
    resizeCanvas();
    boot.classList.add("hidden");
    running = true;
    requestAnimationFrame(loop);
  } catch (err) {
    bootStatus.textContent = "camera access denied — check browser permissions.";
    console.error(err);
  }
}

function resizeCanvas() {
  // Keep the canvas in the same coordinate system as the video frame.
  // drawOverlay() handles the visible "object-fit: cover" crop.
  const cssW = overlay.clientWidth || window.innerWidth;
  const cssH = overlay.clientHeight || window.innerHeight;

  // Use CSS pixels for drawing so the overlay aligns with the visible video.
  overlay.width = cssW * window.devicePixelRatio;
  overlay.height = cssH * window.devicePixelRatio;
  overlay.style.width = cssW + "px";
  overlay.style.height = cssH + "px";
  ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
}
window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", () => {
  setTimeout(resizeCanvas, 150);
});

function scaledRect(box) {
  // ObjectDetector returns pixel coords already matching the video's native resolution
  return {
    x: box.originX,
    y: box.originY,
    w: box.width,
    h: box.height,
  };
}

function getCoverTransform() {
  const vw = video.videoWidth || overlay.width;
  const vh = video.videoHeight || overlay.height;
  const cw = overlay.clientWidth || window.innerWidth;
  const ch = overlay.clientHeight || window.innerHeight;

  const scale = Math.max(cw / vw, ch / vh);
  const displayedW = vw * scale;
  const displayedH = vh * scale;
  const offsetX = (cw - displayedW) / 2;
  const offsetY = (ch - displayedH) / 2;

  return { vw, vh, cw, ch, scale, offsetX, offsetY };
}

function videoToScreen(x, y) {
  const t = getCoverTransform();
  return {
    x: x * t.scale + t.offsetX,
    y: y * t.scale + t.offsetY
  };
}

function drawThirds() {
  const t = getCoverTransform();
  ctx.strokeStyle = "rgba(233,236,223,0.28)";
  ctx.lineWidth = 1;

  for (const f of [1 / 3, 2 / 3]) {
    const x = t.cw * f;
    const y = t.ch * f;

    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, t.ch);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(t.cw, y);
    ctx.stroke();
  }
}

function nearestIntersection(cx, cy, w, h) {
  const pts = [
    [w / 3, h / 3], [2 * w / 3, h / 3],
    [w / 3, 2 * h / 3], [2 * w / 3, 2 * h / 3],
  ];
  let best = pts[0], bd = Infinity;
  for (const p of pts) {
    const d = Math.hypot(p[0] - cx, p[1] - cy);
    if (d < bd) { bd = d; best = p; }
  }
  return { x: best[0], y: best[1], dist: bd };
}

function scoreAndGuide(box, w, h) {
  const cx = box.x + box.w / 2;
  const cy = box.y + box.h / 2;
  const target = nearestIntersection(cx, cy, w, h);
  const maxDist = Math.hypot(w, h) / 2;
  const thirdsScore = Math.max(0, 1 - target.dist / maxDist); // 0..1

  const area = (box.w * box.h) / (w * h);
  let sizeScore = 1;
  let sizeMsg = null;
  if (area < 0.04) { sizeScore = 0.3; sizeMsg = "step closer"; }
  else if (area > 0.65) { sizeScore = 0.5; sizeMsg = "step back"; }

  // Estimate headroom from the detected subject's top edge.
  const headroomRatio = box.y / h;
  let headroomScore = 1;
  let headroomMsg = null;
  if (headroomRatio < 0.03) {
    headroomScore = 0.5;
    headroomMsg = "tilt down a touch";
  } else if (headroomRatio > 0.30) {
    headroomScore = 0.7;
    headroomMsg = "tilt up a touch";
  }

  const total = Math.round((thirdsScore * 0.5 + sizeScore * 0.25 + headroomScore * 0.25) * 100);

  // directional message
  let dirMsg = null;
  const dx = target.x - cx, dy = target.y - cy;
  const thresholdX = w * 0.04;
  const thresholdY = h * 0.04;

  if (Math.abs(dx) > thresholdX || Math.abs(dy) > thresholdY) {
    const parts = [];
    if (Math.abs(dx) > thresholdX) {
      parts.push(dx > 0 ? "move right" : "move left");
    }
    if (Math.abs(dy) > thresholdY) {
      parts.push(dy > 0 ? "and down" : "and up");
    }
    dirMsg = parts.join(" ");
  }

  const message = sizeMsg || dirMsg || headroomMsg || (total > 82 ? "Great framing — hold still" : "Fine-tuning…");
  return { total, target, cx, cy, message, arrow: dirMsg ? { dx, dy } : null };
}

function drawSubject(box, result) {
  const topLeft = videoToScreen(box.x, box.y);
  const bottomRight = videoToScreen(box.x + box.w, box.y + box.h);
  const target = videoToScreen(result.target.x, result.target.y);
  const center = videoToScreen(result.cx, result.cy);

  ctx.strokeStyle = "rgba(199,255,94,0.9)";
  ctx.lineWidth = 2;
  ctx.strokeRect(
    topLeft.x,
    topLeft.y,
    bottomRight.x - topLeft.x,
    bottomRight.y - topLeft.y
  );

  ctx.beginPath();
  ctx.arc(target.x, target.y, 10, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(199,255,94,0.9)";
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(target.x, target.y, 2, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(199,255,94,0.9)";
  ctx.fill();

  if (result.arrow) {
    drawArrow(center.x, center.y, target.x, target.y);
  }
}

function drawArrow(x1, y1, x2, y2) {
  const headlen = 12;
  const angle = Math.atan2(y2 - y1, x2 - x1);
  ctx.strokeStyle = "rgba(199,255,94,0.9)";
  ctx.fillStyle = "rgba(199,255,94,0.9)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 6), y2 - headlen * Math.sin(angle - Math.PI / 6));
  ctx.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 6), y2 - headlen * Math.sin(angle + Math.PI / 6));
  ctx.closePath();
  ctx.fill();
}

let lastRun = 0;
function loop(ts) {
  if (!running) return;
  if (video.readyState >= 2 && ts - lastRun > 120) {
    lastRun = ts;
    if (video.videoWidth) resizeCanvas();

    // Canvas backing store remains video-resolution for detection coordinates,
    // while its CSS size matches the screen.
    const w = video.videoWidth, h = video.videoHeight;
    ctx.clearRect(0, 0, overlay.clientWidth || window.innerWidth, overlay.clientHeight || window.innerHeight);

    if (showGrid) drawThirds();

    if (detector) {
      const res = detector.detectForVideo(video, ts);
      const dets = res.detections || [];
      const person = dets.find(d => d.categories[0]?.categoryName === "person") || dets[0];
      if (person) {
        const box = scaledRect(person.boundingBox);
        const result = scoreAndGuide(box, w, h);
        drawSubject(box, result);
        scoreNum.textContent = result.total;
        scoreNum.style.color = result.total > 82 ? "#c7ff5e" : result.total > 55 ? "#ffe15e" : "#ff9d5e";
        guidanceEl.innerHTML = (result.arrow ? '<span class="arrow">↗</span>' : "") + result.message;
        shutter.classList.toggle("ready", result.total > 82);
        lastDet = { box, w, h };
      } else {
        scoreNum.textContent = "–";
        guidanceEl.textContent = "No subject detected — point at a person or object";
        shutter.classList.remove("ready");
        lastDet = null;
      }
    }
  } else if (showGrid) {
    // keep grid drawn between detection ticks
  }
  requestAnimationFrame(loop);
}

function capture() {
  if (!stream || video.readyState < 2 || !video.videoWidth) return;

  const c = document.createElement("canvas");
  c.width = video.videoWidth;
  c.height = video.videoHeight;
  const cctx = c.getContext("2d");
  if (facing === "user") {
    cctx.translate(c.width, 0);
    cctx.scale(-1, 1);
  }
  cctx.drawImage(video, 0, 0, c.width, c.height);
  reviewImg.src = c.toDataURL("image/jpeg", 0.92);
  review.classList.add("show");
  reviewImg.dataset.filename = `framewright-${Date.now()}.jpg`;
}

shutter.addEventListener("click", capture);

document.getElementById("retake").addEventListener("click", () => {
  review.classList.remove("show");
});

document.getElementById("save").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = reviewImg.src;
  a.download = reviewImg.dataset.filename || "framewright-photo.jpg";
  document.body.appendChild(a);
  a.click();
  a.remove();
  review.classList.remove("show");
});

flipBtn.addEventListener("click", async () => {
  if (!stream) return;

  facing = facing === "environment" ? "user" : "environment";
  stream.getTracks().forEach(t => t.stop());
  stream = null;
  await startCamera();
});

gridBtn.addEventListener("click", () => {
  showGrid = !showGrid;
  gridBtn.style.opacity = showGrid ? "1" : "0.4";
});

startBtn.addEventListener("click", async () => {
  startBtn.disabled = true;

  const modelLoaded = await loadModel();
  if (!modelLoaded) {
    startBtn.disabled = false;
    return;
  }

  await startCamera();

  if (!stream) {
    startBtn.disabled = false;
  }
});
</script>
</body>
</html>
